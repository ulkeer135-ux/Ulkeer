name: Annem APK derle

on:
  push:
    branches: [annem-launcher]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk Annem.apk

      # Derleme hatalarını giriş yapmadan da görülebilen uyarı notlarına (annotation) yazar.
      - name: Derleme hatalarını göster
        if: failure()
        run: |
          errs=$(grep -E "^e: " build.log | head -25)
          if [ -z "$errs" ]; then errs=$(grep -A 12 "What went wrong" build.log | head -25); fi
          msg=$(printf '%s' "$errs" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Derleme hatası::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: Annem-APK
          path: Annem.apk

      # Telefondan tek bağlantıyla indirilebilsin diye APK bir sürüm (release) olarak da yayınlanır.
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view annem-latest >/dev/null 2>&1 || \
            gh release create annem-latest --target "$GITHUB_SHA" \
              --title "Annem – sade ana ekran" \
              --notes "Telefona indirip kurun. Kurulum adımları: annem-launcher dalındaki README."
          gh release upload annem-latest Annem.apk --clobber
