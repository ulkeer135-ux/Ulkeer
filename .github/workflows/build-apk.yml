name: Annem APK derle

on:
  push:
    branches: [annem-launcher, annem-anne]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          # annem-anne dalı: annenin telefonu için ayrı dosya (Daha fazla'sız).
          if [ "$GITHUB_REF_NAME" = "annem-anne" ]; then APK=AnnemAnne.apk; else APK=Annem.apk; fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

      # Derleme hatalarını giriş yapmadan da görülebilen uyarı notlarına (annotation) yazar.
      - name: Derleme hatalarını göster
        if: failure()
        run: |
          errs=$(grep -E "^e: " build.log | head -25)
          if [ -z "$errs" ]; then errs=$(grep -A 12 "What went wrong" build.log | head -25); fi
          msg=$(printf '%s' "$errs" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Derleme hatası::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      # Telefondan tek bağlantıyla indirilebilsin diye APK bir sürüm (release) olarak da yayınlanır.
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view annem-latest >/dev/null 2>&1 || \
            gh release create annem-latest --target "$GITHUB_SHA" \
              --title "Annem – sade ana ekran" \
              --notes "Telefona indirip kurun. Kurulum adımları: annem-launcher dalındaki README."
          # GitHub yükleme bazen geçici hata veriyor: 4 kez dene.
          for i in 1 2 3 4; do
            gh release upload annem-latest "$APK" --clobber && exit 0
            echo "Yükleme başarısız ($i), 15 sn sonra yeniden..."; sleep 15
          done
          exit 1
