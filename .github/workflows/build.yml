name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Derle
        run: gradle assembleRelease --no-daemon
      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Amperimetre.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Amperimetre-apk
          path: Amperimetre.apk
      - name: Sürüm (Release) olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.1.${{ github.run_number }}" Amperimetre.apk \
            --title "Amperimetre v1.1.${{ github.run_number }}" \
            --notes "Şarj akımı ölçer. Ekran kapanınca ölçüm sıfırlanmaz." --latest
